<body>
<div class="wrap" id="app" aria-live="polite"><p class="muted" style="margin-top:40px">Loading…</p></div>
<script>
/* YNAB export parser: turns Plan.csv + Register.csv into one compact snapshot. */
const FinParse = (function () {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(f); f = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = [];
      } else f += ch;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    if (!rows.length) return [];
    const head = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => o[h] = r[i] === undefined ? '' : r[i]); return o; });
  }

  function money(s) {
    if (s == null) return 0;
    s = String(s).trim(); if (!s) return 0;
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-\$/.test(s);
    const n = parseFloat(s.replace(/[^0-9.]/g, ''));
    return isNaN(n) ? 0 : (neg ? -n : n);
  }
  const r2 = x => Math.round(x * 100) / 100;

  function monthKey(label) { // "Oct 2026" -> "2026-10"
    const m = String(label).trim().match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{4})$/);
    if (!m) return null;
    const i = MONTHS.indexOf(m[1].charAt(0).toUpperCase() + m[1].slice(1, 3).toLowerCase());
    return i < 0 ? null : m[2] + '-' + String(i + 1).padStart(2, '0');
  }
  function isoDate(s) { // MM/DD/YYYY or YYYY-MM-DD -> YYYY-MM-DD
    s = String(s).trim(); let m;
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return m[3] + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0');
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + '-' + m[2] + '-' + m[3];
    return null;
  }
  const clean = s => String(s == null ? '' : s).trim();

  function build(planText, regText, opts) {
    opts = opts || {};
    const asOf = opts.asOf; // YYYY-MM-DD, required
    const plan = parseCSV(planText), reg = parseCSV(regText);
    if (!plan.length || !('Assigned' in plan[0]) || !('Month' in plan[0])) throw new Error('The Plan file is missing the Month / Assigned columns. Use the "Plan.csv" file from the YNAB export.');
    if (!reg.length || !('Outflow' in reg[0]) || !('Account' in reg[0])) throw new Error('The Register file is missing the Account / Outflow columns. Use the "Register.csv" file from the YNAB export.');

    // ---- months + categories
    const mset = new Set();
    plan.forEach(r => { const k = monthKey(r.Month); if (k) mset.add(k); });
    const months = Array.from(mset).sort();
    const mi = {}; months.forEach((m, i) => mi[m] = i);
    const cats = {}, order = [];
    plan.forEach(r => {
      const k = monthKey(r.Month); if (!k) return;
      const g = clean(r['Category Group']), c = clean(r.Category), key = g + '|' + c;
      if (!cats[key]) { cats[key] = { g, c, a: months.map(() => 0), x: months.map(() => 0), v: months.map(() => 0) }; order.push(key); }
      const o = cats[key], i = mi[k];
      o.a[i] = r2(money(r.Assigned)); o.x[i] = r2(money(r.Activity)); o.v[i] = r2(money(r.Available));
    });

    // ---- accounts: month-end balances from the register
    const accts = {}, tx = [];
    const first = months[0], lastM = months[months.length - 1];
    const asOfM = asOf.slice(0, 7);
    const cutoff = new Date(asOf + 'T00:00:00'); cutoff.setDate(cutoff.getDate() - 120);
    const cutIso = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
    reg.forEach(r => {
      const d = isoDate(r.Date); if (!d || d > asOf) return;
      const name = clean(r.Account); if (!name) return;
      const net = money(r.Inflow) - money(r.Outflow);
      const a = accts[name] || (accts[name] = { n: name, per: {}, last: d, firstD: d, bal: 0 });
      let mk = d.slice(0, 7); if (mk < first) mk = first;
      a.per[mk] = (a.per[mk] || 0) + net; a.bal += net;
      if (d > a.last) a.last = d; if (d < a.firstD) a.firstD = d;
      if (d >= cutIso) {
        const c = clean(r.Category), g = clean(r['Category Group']);
        tx.push({ d, a: name, p: clean(r.Payee).slice(0, 48), g, c, m: r2(net) });
      }
    });
    const accounts = Object.values(accts).map(a => {
      let run = 0; const s = months.map(m => { run += (a.per[m] || 0); return r2(run); });
      return { n: a.n, bal: r2(a.bal), last: a.last, first: a.firstD, s };
    }).sort((x, y) => x.n.localeCompare(y.n));
    tx.sort((x, y) => y.d.localeCompare(x.d));

    return {
      v: 1, asOf, importedAt: opts.importedAt || new Date().toISOString(), source: opts.source || '',
      months, cats: order.map(k => cats[k]), accts: accounts, tx,
      rows: { plan: plan.length, reg: reg.length }
    };
  }

  /* YNAB API budget (GET /budgets/{id}) -> the same snapshot build() produces. */
  function fromYnabApi(b, opts) {
    opts = opts || {};
    const asOf = opts.asOf, asOfM = asOf.slice(0, 7);
    const u = x => r2((+x || 0) / 1000);
    const grp = {}; (b.category_groups || []).forEach(g => { grp[g.id] = g.name; });
    const catById = {};
    (b.categories || []).forEach(c => {
      let g = clean(c.category_group_name || grp[c.category_group_id]), n = clean(c.name);
      if (g === 'Internal Master Category') { g = 'Inflow'; n = n.replace(/^Inflow:\s*/, ''); }
      catById[c.id] = { g, c: n };
    });
    const payee = {}; (b.payees || []).forEach(p => { payee[p.id] = p.name; });
    const acctName = {}; (b.accounts || []).forEach(a => { if (!a.deleted) acctName[a.id] = a.name; });

    // months + categories
    const mlist = (b.months || []).filter(m => !m.deleted && m.month && m.month.slice(0, 7) <= asOfM)
      .sort((x, y) => x.month.localeCompare(y.month));
    const months = mlist.map(m => m.month.slice(0, 7));
    if (!months.length) throw new Error('YNAB returned no months for this budget.');
    const cats = {}, order = [];
    mlist.forEach((m, i) => (m.categories || []).forEach(c => {
      if (c.deleted) return;
      const known = catById[c.id] || {};
      const g = clean(c.category_group_name || known.g || grp[c.category_group_id]), n = clean(c.name);
      if (g === 'Internal Master Category' || g === 'Inflow' || /^Inflow: Ready to Assign$/.test(n) || n === 'Uncategorized') return;
      const key = g + '|' + n;
      if (!cats[key]) { cats[key] = { g, c: n, a: months.map(() => 0), x: months.map(() => 0), v: months.map(() => 0), hid: !!c.hidden }; order.push(key); }
      const o = cats[key]; o.a[i] = u(c.budgeted); o.x[i] = u(c.activity); o.v[i] = u(c.balance);
    }));
    const catList = order.map(k => cats[k]).filter(o => !(o.hid && !o.a.some(Boolean) && !o.x.some(Boolean) && !o.v.some(Boolean)));
    catList.forEach(o => { delete o.hid; });

    // accounts: month-end balances from transactions, last 120 days of detail
    const first = months[0];
    const cutoff = new Date(asOf + 'T00:00:00'); cutoff.setDate(cutoff.getDate() - 120);
    const cutIso = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
    const subs = {}; (b.subtransactions || []).forEach(s => { if (!s.deleted) (subs[s.transaction_id] = subs[s.transaction_id] || []).push(s); });
    const accts = {}, tx = []; let count = 0;
    (b.transactions || []).forEach(t => {
      if (t.deleted) return;
      const d = isoDate(t.date); if (!d || d > asOf) return;
      const name = acctName[t.account_id]; if (!name) return;
      count++;
      const net = u(t.amount);
      const a = accts[name] || (accts[name] = { n: name, per: {}, last: d, firstD: d, bal: 0 });
      let mk = d.slice(0, 7); if (mk < first) mk = first;
      a.per[mk] = (a.per[mk] || 0) + net; a.bal += net;
      if (d > a.last) a.last = d; if (d < a.firstD) a.firstD = d;
      if (d >= cutIso) {
        const pn = clean(payee[t.payee_id]);
        const parts = subs[t.id];
        if (parts && parts.length) parts.forEach(s => {
          const cc = catById[s.category_id] || { g: '', c: '' };
          tx.push({ d, a: name, p: clean(payee[s.payee_id] || pn).slice(0, 48), g: cc.g, c: cc.c, m: u(s.amount) });
        });
        else { const cc = catById[t.category_id] || { g: '', c: '' }; tx.push({ d, a: name, p: pn.slice(0, 48), g: cc.g, c: cc.c, m: net }); }
      }
    });
    const accounts = Object.values(accts).map(a => {
      let run = 0; const s = months.map(m => { run += (a.per[m] || 0); return r2(run); });
      return { n: a.n, bal: r2(a.bal), last: a.last, first: a.firstD, s };
    }).sort((x, y) => x.n.localeCompare(y.n));
    tx.sort((x, y) => y.d.localeCompare(x.d));
    return {
      v: 1, asOf, importedAt: opts.importedAt || new Date().toISOString(), source: opts.source || '',
      months, cats: catList, accts: accounts, tx,
      rows: { plan: catList.length * months.length, reg: count }
    };
  }
  return { parseCSV, money, monthKey, isoDate, build, fromYnabApi };
})();
window.FinParse = FinParse;

</script>
<script>
(function () {
'use strict';
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d) => { d = d || 0; const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); return (n < -0.004 ? '\u2212' : '') + '$' + v; };
const fmt2 = n => fmt(n, 2);
const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthLabel = k => MN[+k.slice(5) - 1] + ' ' + k.slice(0, 4);
const monthShort = k => MN[+k.slice(5) - 1] + " '" + k.slice(2, 4);
const niceDate = d => { const p = d.split('-'); return MN[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]; };
const todayIso = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };

function simulate(loans, extra, strategy, roll) {

/* ---------- charts ---------- */
function lineChart(vals, labels) {

  area = d + 'L' + x(n - 1).toFixed(1) + ' ' + (H - B) + 'L' + x(0).toFixed(1) + ' ' + (H - B) + 'Z';

  let xl = ''; const step = Math.max(1, Math.round(n / 6));
  labels.forEach((lb, i) => { if (i % step === 0 || i === n - 1) xl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === n - 1 ? 'end' : 'middle') + '">' + esc(lb) + '</text>'; });

function calc() {

function retire() {
  const st = S.set, P = st.people, L = st.limits, N = st.paychecks, c = calc(), tr = tracker();
  let magi = c.gross; Object.keys(P).forEach(k => { magi -= (P[k].hsa + P[k].pretaxOther) * N; });
  const lo = L.roLo, hi = L.roHi;
  const msg = magi < lo ? 'Under the limit: direct Roth IRA contributions work.' : magi > hi ? 'Over the limit: use the backdoor Roth.' : 'Inside the phase-out range: wait for the W-2s, then decide direct or backdoor.';
  const warns = []; Object.keys(P).forEach(k => { const p = P[k], d = p.roth401k / p.gross * 100; if (d + 0.01 < p.matchNeeds) warns.push(p.label + ' defers ' + d.toFixed(1) + '% but needs ' + p.matchNeeds + '% for the full match.'); });
  const pos = Math.max(0, Math.min(1, (magi - (lo - 20000)) / ((hi + 20000) - (lo - 20000))));
  return '<h2>' + st.year + ' contribution room</h2><p class="lede">Projected for the full year if every paycheck matches the latest stub. Payroll deductions never show up in YNAB, so these come from the pay stub numbers under Settings.</p>' +

    '<div class="track" style="margin:14px 0 6px"><div class="fill" style="width:' + (pos * 100).toFixed(1) + '%;background:' + (magi < lo ? 'var(--good)' : magi > hi ? 'var(--bad)' : 'var(--warn)') + '"></div></div><div class="legend"><span>' + fmt(lo - 20000) + '</span><span>phase-out ' + fmt(lo) + ' to ' + fmt(hi) + '</span><span>' + fmt(hi + 20000) + '</span></div>' +

function runway() {
  const st = S.set, c = calc(), t = typeTotals(curIdx()), ns = monthlyNeeds();

/* ---------- loans ---------- */

  const base = simulate(L, 0, S.strategy, false), plan = simulate(L, S.extra, S.strategy, true);

/* ---------- render ---------- */
function render() {
  const app = $('#app'); if (!app) return;
  const focusId = document.activeElement && document.activeElement.id;

  else if (!S.snap) body = emptyView();
  else body = ({ overview, plan, retire, loans, runway }[S.tab] || overview)();
  app.innerHTML = header() + '<main>' + (S.tab !== 'update' && S.msg ? '<div class="banner' + (S.msg.err ? ' err' : '') + '">' + esc(S.msg.t) + '</div>' : '') + body + '</main>';
  wireDrop();
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) try { el.focus(); } catch (e) { } }
}

/* ---------- import ---------- */
function wireDrop() {
  const d = $('#drop'), f = $('#file'); if (!d) return;
  ['dragenter', 'dragover'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove('hot'); }));
  d.addEventListener('drop', ev => { if (ev.dataTransfer && ev.dataTransfer.files.length) importFiles(Array.from(ev.dataTransfer.files)); });
  f.addEventListener('change', () => { if (f.files.length) importFiles(Array.from(f.files)); });
}
async function importFiles(files) {
  S.busy = true; S.msg = null; render();
  try {
    let plan = null, reg = null, src = '';
    const take = (txt, name) => {
      const head = txt.slice(0, 400);
      if (/Assigned/.test(head) && /Month/.test(head)) { plan = txt; src = src || name; }
      else if (/Outflow/.test(head) && /Account/.test(head)) { reg = txt; src = src || name; }
    };
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) {
        if (!window.JSZip) throw new Error('The zip reader didn\u2019t load. Unzip the file and drop the two .csv files instead.');
        const z = await window.JSZip.loadAsync(f);
        for (const nm of Object.keys(z.files)) if (/\.csv$/i.test(nm)) take(await z.files[nm].async('string'), nm);
      } else if (/\.csv$/i.test(f.name)) take(await f.text(), f.name);
    }
    if (!plan || !reg) throw new Error('I need both the Plan and Register files. ' + (plan ? 'The Register file is missing.' : reg ? 'The Plan file is missing.' : 'Neither file looked like a YNAB export.'));
    const prev = S.snap;
    const snap = window.FinParse.build(plan, reg, { asOf: todayIso(), source: src.replace(/\s*-\s*(Plan|Register)\.csv$/i, '').replace(/^.*\//, '') });
    const nwOf = sn => sn.accts.reduce((s, a) => acctType(a.n) === 'ignore' ? s : s + a.bal, 0);
    S.snap = snap; S.month = latestMonth();
    await saveSnap();
    let t = 'Imported ' + snap.rows.reg.toLocaleString() + ' transactions through ' + niceDate(snap.asOf) + '.';
    if (prev) t += ' Net worth moved ' + fmt(nwOf(snap) - nwOf(prev)) + ' since the last import.';
    S.msg = { t };
  } catch (e) { S.msg = { err: true, t: (e && e.message) || String(e) }; }
  S.busy = false; render();
}


/* ---------- YNAB sync ---------- */
const YNAB = 'https://api.ynab.com/v1';
const Y = { budgets: null, loading: false };
function tokGet() { try { return localStorage.getItem('fin.ynab.token') || ''; } catch (e) { return ''; } }
function tokSet(v) { try { if (v) localStorage.setItem('fin.ynab.token', v); else localStorage.removeItem('fin.ynab.token'); return true; } catch (e) { return false; } }
function tokBudget() { try { return localStorage.getItem('fin.ynab.budget') || ''; } catch (e) { return ''; } }
function tokBudgetSet(v) { try { if (v) localStorage.setItem('fin.ynab.budget', v); else localStorage.removeItem('fin.ynab.budget'); } catch (e) { } }
async function ynabGet(path, token) {
  let r;
  try { r = await fetch(YNAB + path, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } }); }
  catch (e) { const err = new Error('Could not reach YNAB. Check your connection and try again.'); err.code = 'net'; throw err; }
  if (r.status === 401) { const err = new Error('YNAB rejected the token. Make a new one in YNAB under Account Settings, Developer Settings.'); err.code = 'auth'; throw err; }
  if (r.status === 429) { const err = new Error('YNAB’s hourly request limit was reached. Try again in a while.'); err.code = 'rate'; throw err; }
  if (!r.ok) { const err = new Error('YNAB returned an error (' + r.status + ').'); err.code = 'http'; throw err; }
  return (await r.json()).data;
}
async function ynabEnsure() {
  const tok = tokGet();
  if (!tok || Y.budgets || Y.loading) return;
  Y.loading = true; render();
  try {
    const d = await ynabGet('/budgets', tok);
    Y.budgets = (d.budgets || []).filter(b => !b.deleted).map(b => ({ id: b.id, name: b.name }));
    const cur = tokBudget();
    if (!Y.budgets.some(b => b.id === cur)) {
      const pick = (d.default_budget && Y.budgets.find(b => b.id === d.default_budget.id)) || Y.budgets[0];
      tokBudgetSet(pick ? pick.id : '');
    }
  } catch (e) {
    if (e.code === 'auth') tokSet('');
    S.msg = { err: true, t: e.message };
  }
  Y.loading = false; render();
}
async function ynabConnect() {
  const el = document.getElementById('ynab-token'); const v = el ? el.value.trim() : '';
  if (!v) { S.msg = { err: true, t: 'Paste the token first.' }; render(); return; }
  if (!tokSet(v)) { S.msg = { err: true, t: 'This browser would not save the token, so sync cannot be used here.' }; render(); return; }
  S.msg = null; Y.budgets = null; await ynabEnsure();
}
async function ynabSync() {
  const tok = tokGet(), id = tokBudget();
  S.busy = true; S.msg = null; render();
  try {
    if (!tok || !id) throw new Error('Connect YNAB and choose a budget first.');
    const d = await ynabGet('/budgets/' + encodeURIComponent(id), tok);
    const prev = S.snap;
    const snap = window.FinParse.fromYnabApi(d.budget, { asOf: todayIso(), source: 'YNAB sync, ' + d.budget.name });
    const nwOf = sn => sn.accts.reduce((s, a) => acctType(a.n) === 'ignore' ? s : s + a.bal, 0);
    S.snap = snap; S.month = latestMonth();
    await saveSnap();
    let t = 'Synced ' + snap.rows.reg.toLocaleString() + ' transactions through ' + niceDate(snap.asOf) + '.';
    if (prev) t += ' Net worth moved ' + fmt(nwOf(snap) - nwOf(prev)) + ' since the last refresh.';
    S.msg = { t };
  } catch (e) {
    if (e.code === 'auth') { tokSet(''); Y.budgets = null; }
    S.msg = { err: true, t: (e && e.message) || String(e) };
  }
  S.busy = false; render();
}
async function restoreFile(f) {
  if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || typeof o !== 'object' || (!o.settings && !o.snapshot)) throw new Error('That file has no settings or data in it.');
    if (o.settings) { S.set = mergeDefaults(clone(o.settings), defaults()); lsSet('fin.settings', S.set); }
    if (o.snapshot && o.snapshot.months) { S.snap = o.snapshot; await saveSnap(); S.month = latestMonth(); }
    S.msg = { t: 'Restored ' + [o.settings ? 'settings' : '', o.snapshot && o.snapshot.months ? 'data' : ''].filter(Boolean).join(' and ') + ' from ' + f.name + '.' };
  } catch (e) { S.msg = { err: true, t: 'Could not read that file. ' + ((e && e.message) || '') }; }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'tab') { S.tab = v; S.msg = (v === 'update') ? S.msg : null; render(); window.scrollTo(0, 0); if (v === 'update') ynabEnsure(); }
  else if (a === 'ignore') { S.set.acctType[v] = 'ignore'; saveSettings(); render(); }
  else if (a === 'reset') { S.set = defaults(); saveSettings(); S.msg = { t: 'Settings reset to defaults.' }; render(); }
  else if (a === 'ynabsave') { await ynabConnect(); }
  else if (a === 'ynabsync') { await ynabSync(); }
  else if (a === 'ynabforget') { tokSet(''); tokBudgetSet(''); Y.budgets = null; S.msg = { t: 'Disconnected. The token was removed from this browser.' }; render(); }
  else if (a === 'backup') {
    try {
      const blob = new Blob([JSON.stringify({ snapshot: S.snap, settings: S.set }, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = 'money-checkin-backup-' + todayIso() + '.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { S.msg = { err: true, t: 'Could not save the backup.' }; render(); }
  }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.row[data-a="cat"]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.a) return;
  const a = el.dataset.a, v = el.dataset.v, st = S.set;
  if (a === 'restore') { restoreFile(el.files && el.files[0]); }
  else if (a === 'ynabbudget') { tokBudgetSet(el.value); render(); }
  else if (a === 'month') { S.month = el.value; S.openCat = null; render(); }
  else if (a === 'wed') { S.exclWedding = el.checked; render(); }
  else if (a === 'check') { st.checks[v] = el.checked; saveSettings(); render(); }
  else if (a === 'extra') { S.extra = Math.max(0, +el.value || 0); render(); }
  else if (a === 'strategy') { S.strategy = el.value; render(); }
  else if (a === 'rate') { st.loanRates[v] = Math.max(0, +el.value || 0); saveSettings(); render(); }
  else if (a === 'atype') { st.acctType[v] = el.value; saveSettings(); render(); }
  else if (a === 'need') { const s = needsSet(); el.checked ? s.add(v) : s.delete(v); st.needs = Array.from(s); saveSettings(); render(); }
  else if (a === 'rw') { st.runway.added = Math.max(0, +el.value || 0); saveSettings(); render(); }
  else if (a === 'mt') { st.monthsTarget = Math.max(1, +el.value || 3); saveSettings(); render(); }
  else if (a === 'pc') { st.paychecks = Math.max(1, +el.value || 26); saveSettings(); render(); }
  else if (a === 'lim') { st.limits[el.dataset.k] = +el.value || 0; saveSettings(); render(); }
  else if (a === 'pay') { const k = el.dataset.k, w = el.dataset.who; st.people[w][k] = (k === 'next') ? el.value : (el.value === '' ? '' : (+el.value || 0)); saveSettings(); render(); }
});

boot();
})();

</script>
